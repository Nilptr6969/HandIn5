syntax = "proto3";
option go_package = "project-root/grpc/proto";

message Bid {
    int32 bid = 1;
    string name = 2;
    int32 timestamp = 3;
}

message Acknowledgement {
    string outcome = 1;
    int32 timestamp = 2;
}

message ResultRequest {
    int32 timestamp = 1;
}

message ResultResponse {
    bool isFinished = 1;
    int32 highestBid = 2;
    string winnerName = 3;
    int32 timestamp = 4;
}

message Election {
    int32 timestamp = 1;
}

message Status {
    bool isDone = 1;
    int32 highestBid = 2;
    string winningName = 3;
    int32 timestamp = 4;
    int32 currentLeader = 5;
}

service Client {
    rpc bid (Bid) returns (Acknowledgement);
    rpc result (ResultRequest) returns (ResultResponse);
}

service Node {
    rpc nodeBid (Bid) returns (Acknowledgement);
    rpc election (Election) returns (Election);
    rpc write (Status) returns (Acknowledgement);
    rpc nodeJoin (Election) returns (Election);
}
